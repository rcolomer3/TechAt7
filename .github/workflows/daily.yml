name: Daily radar
on:
  push:
    branches: [main]
    paths:
      - 'editions/*.json'
      - '!editions/*-extra.json'
  schedule:
    # Backups for editions pushed early and for publication retries.
    - cron: '5 19 * * *'
      timezone: Europe/Madrid
    - cron: '20 19 * * *'
      timezone: Europe/Madrid
    - cron: '45 19 * * *'
      timezone: Europe/Madrid
    - cron: '15 20 * * *'
      timezone: Europe/Madrid
    - cron: '40 20 * * *'
      timezone: Europe/Madrid
    - cron: '5 21 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha AAAA-MM-DD. Vacío = hoy en Madrid'
        type: string
        required: false
      archive:
        description: 'Importar edición histórica sin avisar'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: daily-radar
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'push' && 70 || 10 }}
    steps:
      - name: Esperar a las 19:00 si la edición llega durante la última hora
        if: github.event_name == 'push'
        shell: bash
        run: |
          IFS=: read -r hour minute second <<< "$(TZ=Europe/Madrid date +%H:%M:%S)"
          remaining=$((19 * 3600 - 10#$hour * 3600 - 10#$minute * 60 - 10#$second))
          if (( remaining > 0 && remaining <= 3600 )); then
            echo "Publicación a las 19:00 de Madrid en $remaining segundos."
            sleep "$remaining"
          fi
      - uses: actions/checkout@v4
        with:
          # A newer editorial revision may have arrived during the wait.
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Validar y publicar la edición de ChatGPT
        run: node scripts/daily.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RADAR_DATE: ${{ inputs.date }}
          RADAR_ARCHIVE: ${{ inputs.archive }}
      - name: Informe de publicación
        if: always()
        run: |
          if test -f work/publication-report.json; then
            echo '### TechAt7' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat work/publication-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
